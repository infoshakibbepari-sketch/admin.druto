<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14183A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DRUTO Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4FA;--card:#fff;--ink:#1D2250;--mut:#6B7094;--line:#E4E6F2;--pri:#2B3590;--pri-t:#fff;--acc:#F5B700;--ok:#1E9E6A;--bad:#D64550;--wait:#B87400;--chip:#E9EBF8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1230;--card:#181C45;--ink:#EEF0FF;--mut:#9A9FCB;--line:#262B5E;--pri:#F5B700;--pri-t:#1D2250;--chip:#232855;--ok:#4FD4A0;--bad:#FF7B84;--wait:#FFC24D}}
:root[data-theme="dark"]{--bg:#0F1230;--card:#181C45;--ink:#EEF0FF;--mut:#9A9FCB;--line:#262B5E;--pri:#F5B700;--pri-t:#1D2250;--chip:#232855;--ok:#4FD4A0;--bad:#FF7B84;--wait:#FFC24D}
*{box-sizing:border-box;margin:0}
body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;user-drag:none}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:14.5px;line-height:1.45}
#app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px}
.lg{width:48px;height:34px;flex:none}
.bn2{display:flex;flex-direction:column;line-height:1}
.bn2 b{font-size:22px;font-style:italic;font-weight:800;letter-spacing:.5px}
.bn2 small{font-size:7.4px;font-weight:800;color:#F7931E;letter-spacing:.5px;margin-top:3px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(43,53,144,.35)}
.logo svg{width:100%;height:100%;display:block;border-radius:12px}
.bell{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.bell svg{width:21px;height:21px}
.bell i{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px Manrope;text-align:center;font-style:normal}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
h1{font-size:21px;font-weight:800;margin-bottom:12px}
h2{font-size:15.5px;font-weight:700;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 a{font-size:13px;color:var(--pri);font-weight:600;cursor:pointer}
.mut{color:var(--mut);font-size:13px}
.btn{border:0;border-radius:14px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--acc);color:#1D2250}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.pri{background:var(--pri);color:var(--pri-t)}
.btn.full{width:100%;padding:14px}
:is(.btn,.tab,.chip,.ord,input,select,.bell,.cc,.q button,.lk):focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ok);font-weight:700}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.25}}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px}
.up{color:var(--ok);font-weight:700;font-size:13px}.dn{color:var(--bad);font-weight:700;font-size:13px}
.rng{display:flex;gap:6px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:6px 13px;border-radius:20px;font:inherit;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--pri);color:var(--pri-t)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin:10px 0 4px}
svg.ch{width:100%;height:auto;display:block;margin-top:8px;touch-action:manipulation}
.ln.s{animation:none;stroke-dashoffset:0}
.ln{fill:none;stroke:var(--pri);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:dw 1.1s ease forwards}
@keyframes dw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.ln{animation:none;stroke-dashoffset:0}.live::before{animation:none}}
.q{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.q button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 2px;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.q svg{width:23px;height:23px}
.q .pt{background:var(--acc);color:#1D2250;border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px}.stat b{font-size:21px;display:block}.stat span{font-size:12px;color:var(--mut)}
.slider{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -16px;padding-inline:16px;scroll-padding-inline:16px}
.cc{flex:0 0 72%;scroll-snap-align:start;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:var(--acc);color:#1D2250;display:grid;place-items:center;font-weight:800;flex:none}
.cc .r{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.cc b{display:block}
.ord{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px;display:flex;gap:12px;align-items:center;font:inherit;color:inherit;cursor:pointer}
.ord .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--chip)}
.ord .m{flex:1;min-width:0}.ord .m b,.ord .rr b{display:block}.ord .m span{font-size:12.5px;color:var(--mut)}.ord .rr{text-align:right}
.tag{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;display:inline-block}
.t-ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.t-bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.t-wait{background:color-mix(in srgb,var(--wait) 20%,transparent);color:var(--wait)}
.t-way{background:var(--chip);color:var(--pri)}
label{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 5px;font-weight:600}
input,select{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.srch{display:flex;gap:8px}.srch .btn{padding:0 14px;display:grid;place-items:center}.srch svg{width:20px;height:20px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.lk{background:none;border:0;color:var(--pri);font:inherit;font-weight:700;cursor:pointer;padding:6px 0}
.calc{background:var(--card);border:1px dashed var(--mut);border-radius:16px;padding:14px;margin:16px 0}
.calc div{display:flex;justify-content:space-between;padding:3px 0}
.calc .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:800;font-size:16px}
.tx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}.tx span{color:var(--mut);font-size:12.5px;display:block}
.plus{color:var(--ok);font-weight:700}.minus{color:var(--bad);font-weight:700}
.pf{padding:2px 14px}
input[type=checkbox]{width:44px;height:24px;accent-color:var(--pri)}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;font:inherit;font-size:11px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px;cursor:pointer;border-radius:12px}
.tab svg{width:22px;height:22px}.tab.on{color:var(--pri);font-weight:800}
.fab{width:50px;height:50px;border-radius:50%;background:var(--acc);color:#1D2250;display:grid;place-items:center;box-shadow:0 6px 16px rgba(245,183,0,.45);transform:translateY(-14px)}
.tab.add{padding-top:0}.tab.add span{margin-top:-10px}
.bg{position:absolute;inset:0;background:rgba(10,12,40,.55);display:none;z-index:5}
.bg.show{display:flex}.bg.s{align-items:flex-end}.bg.p{align-items:center;justify-content:center;padding:24px}
.sheet{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:18px 18px 28px;max-height:88%;overflow-y:auto;animation:up .25s ease}
.pop{background:var(--card);width:100%;border-radius:24px;padding:22px;text-align:center;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.st{font-size:18px;font-weight:800;display:block;margin-bottom:4px}
.gem{width:64px;height:64px;border-radius:20px;background:var(--acc);color:#1D2250;display:grid;place-items:center;margin:0 auto 12px}
.gem svg{width:32px;height:32px}
.tl{margin:14px 0 4px;padding-left:4px}
.tl div{position:relative;padding:0 0 16px 24px;border-left:2px solid var(--line);margin-left:6px}
.tl div::before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.tl div.d{border-color:var(--ok)}.tl div.d::before{background:var(--ok)}
.tl div.c::before{background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 30%,transparent)}
.tl span{display:block;font-size:12.5px;color:var(--mut)}
.toast{position:absolute;left:16px;right:16px;bottom:90px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:9;display:none;text-align:center;font-weight:600}
.pts{background:var(--pri);color:var(--pri-t);border-radius:22px;padding:18px;text-align:center}
.pts .big{font-size:40px}.pbar{height:8px;border-radius:8px;background:rgba(127,127,127,.3);margin:12px 0 6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc)}
.gate{text-align:center;padding:48px 12px}
.gate .gem{background:var(--chip);color:var(--pri)}
.back{background:none;border:0;color:var(--ink);font:inherit;font-weight:700;display:flex;align-items:center;gap:4px;cursor:pointer;margin-bottom:10px;padding:0}
.back svg{width:20px;height:20px}
.posters{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 12px;scroll-padding-inline:16px}
.po{flex:0 0 84%;aspect-ratio:16/10;scroll-snap-align:start;border:0;border-radius:24px;padding:18px;color:#fff;text-align:left;font:inherit;position:relative;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.po small{font-weight:700;letter-spacing:1.5px;font-size:11px;opacity:.85}
.po b{font-size:22px;line-height:1.15;font-weight:800;max-width:75%}
.po em{font-style:normal;font-weight:700;font-size:13px;background:rgba(255,255,255,.22);align-self:flex-start;padding:6px 12px;border-radius:20px;margin-top:8px}
.po .wm{position:absolute;right:-16px;top:-12px;width:160px;height:160px;opacity:.18}
.po .wm svg{width:100%;height:100%;stroke-width:1.2}
.po::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.1);right:-60px;bottom:-70px}
.p1{background:linear-gradient(135deg,#2B3590,#5A3FD1)}
.p2{background:linear-gradient(135deg,#F5B700,#FF8A3D);color:#1D2250}.p2 em{background:rgba(29,34,80,.14)}
.p3{background:linear-gradient(135deg,#0F766E,#22A06B)}
.p4{background:linear-gradient(135deg,#7A1F5C,#C2335E)}
.bn{flex:0 0 92%;scroll-snap-align:start;border:0;border-radius:24px;padding:18px 0 18px 18px;color:#fff;text-align:left;font:inherit;position:relative;overflow:hidden;cursor:pointer;min-height:184px;display:block}
.bn .bt{max-width:56%;position:relative;z-index:1}
.bn b{display:block;font-size:20px;font-weight:800;line-height:1.15;margin-bottom:6px}
.bn p{font-size:13px;opacity:.92;margin:0 0 14px}
.bn .cta{display:inline-block;background:#fff;color:var(--c);padding:9px 16px;border-radius:12px;font-weight:700;font-size:13px}
.bn svg.il{position:absolute;right:-4px;bottom:0;width:50%;height:auto}
.bn::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.1);right:-70px;top:-60px}
.b1{--c:#2B3590;background:linear-gradient(135deg,#2B3590,#4C56D6)}
.b2{--c:#0F766E;background:linear-gradient(135deg,#0F766E,#22A06B)}
.b3{--c:#1D2250;color:#1D2250;background:linear-gradient(135deg,#F5B700,#FF9A4D)}
.hero{background:linear-gradient(135deg,#1D2250,#2B3590 60%,#5A3FD1);color:#fff;border-radius:26px;padding:22px 0 0 20px;position:relative;overflow:hidden;min-height:260px}
.hero::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(245,183,0,.18);right:-80px;top:-80px}
.hero small{letter-spacing:2px;font-weight:700;font-size:11px;color:#F5B700;position:relative}
.hero h1{font-size:28px;line-height:1.1;margin:8px 0;max-width:60%;position:relative}
.hero p{font-size:13.5px;opacity:.9;max-width:56%;margin:0 0 16px;position:relative}
.hero .il{position:absolute;right:-8px;bottom:0;width:48%;height:auto}
.hero .btn{margin-bottom:22px;position:relative;z-index:1}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.svc i{width:40px;height:40px;border-radius:12px;background:var(--chip);color:var(--pri);display:grid;place-items:center;margin-bottom:8px}
.svc i svg{width:22px;height:22px}.svc b{display:block}.svc span{font-size:12.5px;color:var(--mut)}
.stp{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.stp:last-child{border:0}
.stp i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#1D2250;font:800 14px/30px Manrope,sans-serif;text-align:center;font-style:normal}
.stp i svg{width:16px;height:16px;margin-top:7px}
.stp span{display:block;font-size:12.5px;color:var(--mut)}
.zones{display:flex;flex-wrap:wrap;gap:8px}
.band{margin-top:20px;background:var(--acc);color:#1D2250;border-radius:22px;padding:20px;text-align:center}
.band b{font-size:19px;display:block;margin-bottom:12px}.band .btn{background:#1D2250;color:#fff}
.dn-w{position:relative;width:210px;max-width:72%;margin:6px auto 20px}
.dn-w svg{width:100%;display:block}
.dn-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.dn-c b{font-size:32px;font-weight:800;line-height:1}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px}
.cn{display:flex;align-items:center;gap:8px;font-size:13.5px}
.cn i{width:14px;height:14px;border-radius:5px;flex:none}
.cv{display:flex;align-items:center;gap:8px;margin:5px 0 2px}
.cv b{font-size:24px;font-weight:800}
.cv em{font-style:normal;font-size:12px;background:var(--chip);color:var(--mut);padding:2px 8px;border-radius:8px}
.msg{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-t);display:none;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.3);cursor:pointer;z-index:4}
.msg svg{width:26px;height:26px}.msg:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.thread{max-height:40vh;overflow-y:auto;margin:12px 0;display:flex;flex-direction:column;gap:8px}
.bub{align-self:flex-end;background:var(--pri);color:var(--pri-t);padding:9px 13px;border-radius:16px 16px 4px 16px;max-width:80%;word-break:break-word}
.ab{border-radius:26px;position:relative;overflow:hidden;margin-top:16px;color:#fff}
.ab h3{font-size:22px;line-height:1.15;font-weight:800;margin:6px 0 8px}
.ab p{font-size:13.5px;opacity:.92;margin:0}
.ab small{letter-spacing:2px;font-weight:700;font-size:11px;color:#F5B700}
.ab ul{list-style:none;padding:0;margin:12px 0 14px}
.ab li{padding:3px 0 3px 22px;position:relative;font-size:13.5px}
.ab li::before{content:"\2713";position:absolute;left:0;font-weight:800;color:#F5B700}


.mv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;text-align:left}
.mv div{background:rgba(255,255,255,.12);border-radius:18px;padding:14px}
.mv b{display:block;margin-bottom:4px;color:#F5B700}.mv span{font-size:12.5px;opacity:.92}
.ab.a2{background:linear-gradient(135deg,#0F766E,#22A06B);padding:22px 0 0 20px;min-height:250px}
.ab.a2 .t{max-width:58%;position:relative;z-index:1;padding-bottom:22px}
.ab.a2 .btn{background:#fff;color:#0F766E}
.ab.a2 svg{position:absolute;right:-6px;bottom:0;width:46%;height:auto}
.ab.a3{background:linear-gradient(135deg,#F5B700,#FF9A4D);color:#1D2250;padding:22px 18px;text-align:center}
.ab.a3 small,.ab.a3 li::before{color:#1D2250}
.ab.a3 svg{width:min(280px,92%);height:auto;display:block;margin:8px auto 10px}
.ab.a3 ul{display:inline-block;text-align:left}
.ab.a1{background:#F3F5FC;color:#1D2250;text-align:left}
.hr{position:relative;min-height:300px;display:flex;align-items:center}
.ht{width:55%;padding:22px 0 22px 18px;position:relative;z-index:1}
.ab.a1 small{color:#F28A00}.ab.a1 p{opacity:.82}
.hi{position:absolute;right:0;bottom:0;height:100%;width:auto;max-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40%);mask-image:linear-gradient(90deg,transparent 0,#000 40%)}
.ab.a1 .mv{padding:0 14px 16px;margin-top:0}
.ab.a1 .mv div{background:#fff;border:1px solid #E1E5F5;color:#1D2250}
.ab.a1 .mv b{color:#F28A00}
.pk{width:100%;height:auto;display:block;border-radius:18px;margin:10px 0 12px;box-shadow:0 10px 24px rgba(29,34,80,.25)}
.lh{padding:20px}
.lh h1{font-size:28px;line-height:1.1;margin:8px 0}
.lh h3{font-size:22px;line-height:1.15;font-weight:800;margin:6px 0 8px}
.lh p{margin:0}
.eyebrow{letter-spacing:2px;font-weight:700;font-size:11px;color:#F28A00}
.pic{width:100%;height:auto;display:block;border-radius:18px;margin-top:16px}
.empty{text-align:center;padding:16px}.empty .pic{margin:0}
.empty b{display:block;font-size:19px;margin:14px 0 4px}.empty p{margin:0 0 14px}
.ab.a1,.ab.a2,.ab.a3{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.ab small,.ab.a1 small,.ab.a3 small,.ab li::before,.ab.a3 li::before,.ab .mv b,.ab.a1 .mv b{color:#F28A00}
.ab .mv div,.ab.a1 .mv div{background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.ab.a2 .btn,.ab.a3 .btn{background:var(--pri)!important;color:var(--pri-t)!important}
.band{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.band .btn{background:var(--pri);color:var(--pri-t)}
.posters{gap:14px}
.bn{flex:0 0 88%;border-radius:28px;padding:20px 0 20px 20px;min-height:216px;box-shadow:0 16px 28px -14px rgba(29,34,80,.5),inset 0 0 0 1px rgba(255,255,255,.18);background:radial-gradient(circle at 100% 0,rgba(255,255,255,.26),transparent 48%),radial-gradient(rgba(255,255,255,.16) 1.2px,transparent 1.6px) 0 0/14px 14px,linear-gradient(135deg,var(--g1),var(--g2))}

const net={
 db:null,subs:[],
 L(){try{return JSON.parse(localStorage.getItem('druto_net')||'{}')}catch(e){return{}}},

 del(c,id){if(this.db)return this.db.collection(c).doc(id).delete();const d=this.L();if(d[c])delete d[c][id];this.W(d);this.tick();return Promise.resolve()},

 watch(c,cb,w){
  if(this.db){let q=this.db.collection(c);if(w)q=q.where(w[0],'==',w[1]);return q.onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),e=>{net.err=e;net.onerr&&net.onerr(c,e)})}
  const f=()=>cb(Object.entries(this.L()[c]||{}).filter(([k,v])=>!w||v[w[0]]===w[1]).map(([k,v])=>({id:k,...v})));
  this.subs.push(f);f();return()=>{this.subs=this.subs.filter(y=>y!==f)}},
 watchDoc(c,id,cb){
  if(this.db)return this.db.collection(c).doc(id).onSnapshot(s=>cb(s.exists?s.data():null),()=>{});

 if(k==='merchants'){x.phone=x.phone||x.ph||x.id;x.shop=x.shop||x.sn||'';x.name=x.name||x.mn||'';x.joined=tms(x.joined||x.ts)}

 if(k==='popups'||k==='chats')x.ts=tms(x.ts);

 return x}

function aRange(k){
 const d0=new Date();d0.setHours(0,0,0,0);let s,e,lb;
 if(k==='lw'){const sd=(d0.getDay()+1)%7;e=new Date(d0);e.setDate(e.getDate()-sd);s=new Date(e);s.setDate(s.getDate()-7);lb='Last week'}
 else if(k==='lm'){s=new Date(d0.getFullYear(),d0.getMonth()-1,1);e=new Date(d0.getFullYear(),d0.getMonth(),1);lb='Last month'}
 else{s=new Date(d0.getFullYear(),d0.getMonth(),1);e=new Date(d0);e.setDate(e.getDate()+1);lb='This month'}
 return{s,e,lb}}
const dkey=d=>d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
const dshort=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
function aSales(k){
 const r=aRange(k),days=[],idx={};
 for(let d=new Date(r.s);d<r.e;d.setDate(d.getDate()+1)){idx[dkey(d)]=days.length;days.push({d:new Date(d),inc:0,cnt:0})}
 let inc=0,cnt=0,del=0;
 D.parcels.forEach(p=>{const t=new Date(p.ts);if(!(t>=r.s&&t<r.e))return;const i=idx[dkey(t)];if(i==null)return;cnt++;days[i].cnt++;if(p.s==='del'){const c=chg(p).t;inc+=c;del++;days[i].inc+=c}});
 const last=new Date(r.e);last.setDate(last.getDate()-1);
 return{...r,days,inc,cnt,del,span:dshort(r.s)+' – '+dshort(last)}}
const niceMax=n=>{if(n<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(n))),f=n/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p};
const kfmt=n=>n>=1000?(n/1000).toFixed(n%1000?1:0)+'k':String(Math.round(n));
function aChart(days){
 const W=360,H=176,L=38,R=12,T=12,B=24,mx0=Math.max(0,...days.map(x=>x.inc)),mx=niceMax(mx0),n=days.length;
 const X=i=>L+(n>1?i*(W-L-R)/(n-1):(W-L-R)/2),Y=v=>T+(H-T-B)*(1-v/mx);

async function aKyc(ph,st){
 const a=D.apps.find(x=>x.id===ph||x.phone===ph),r=D.riders.find(x=>x.phone===ph);
 try{

function aMDel(ph){
 const m=D.merchants.find(x=>x.phone===ph);if(!m)return;
 aSheet(`<b class="st">Delete this merchant?</b><p class="mut">${esc(m.shop)} · ${esc(ph)}<br>All of this merchant's data (profile, parcels, pickup requests, withdrawals, messages) will be erased permanently. The same number can register a new account afterwards.</p><div class="two"><button class="btn line" onclick="aClose()">Cancel</button><button class="btn pri" style="background:var(--bad);border-color:var(--bad)" onclick="aMDelGo('${ph}')">Delete forever</button></div>`);
}
async function aMDelGo(ph){
 const m=D.merchants.find(x=>x.phone===ph),mid=(m&&m.id)||ph;
 const items=[['merchants',mid]];
 D.parcels.filter(x=>x.mphone===ph).forEach(x=>items.push(['parcels',x.id]));
 D.requests.filter(x=>x.mphone===ph).forEach(x=>items.push(['requests',x.id]));
 D.wd.filter(x=>x.mphone===ph||x.ph===ph).forEach(x=>items.push(['withdrawals',x.id]));
 D.chats.filter(x=>x.mphone===ph).forEach(x=>items.push(['chats',x.id]));
 D.notices.filter(x=>x.to===ph||x.mphone===ph).forEach(x=>items.push(['notices',x.id]));
 let soft=0;
 try{
  await Promise.all(items.map(async([c,id])=>{
   try{await net.del(c,id)}
   catch(e){ /* rules refuse real delete: hide the record instead */
    try{await net.merge(c,id,{deleted:true,blocked:true})}catch(e2){if(c==='merchants')throw e2}
    soft++}
  }));
  aClose();A.view=null;
  D.merchants=D.merchants.filter(x=>x.phone!==ph);
  ['parcels','requests','wd','chats','notices'].forEach(k=>{D[k]=D[k].filter(x=>!(x.mphone===ph||x.to===ph||x.ph===ph))});
  atoast(soft?'Merchant deleted (set Firestore rules delete: true to erase fully)':'Merchant and all data deleted');aDraw();
 }catch(e){aClose();atoast('Could not delete: '+((e&&(e.code||e.message))||''))}
}

async function aRPassGo(ph){

 const upd=d=>{const o={};if(!d||(d.hash==null&&d.password==null&&d.pw==null&&d.pass==null)){o.salt=salt;o.hash=hash}else{if(d.hash!=null){o.salt=salt;o.hash=hash}['password','pw','pass'].forEach(k=>{if(d[k]!=null)o[k]=pw})}return o};

  await net.merge('riders',(r&&r.id)||ph,upd(r));
  if(a)await net.merge('rider_applications',a.id,upd(a));

const GEO={};GEO_RAW.split('\n').forEach(l=>{const i=l.indexOf(':');GEO[l.slice(0,i)]=l.slice(i+1).split(',')});
const AF={};
const pwf=(id,p)=>`<label for="f_${id}">Password</label><div class="pwx"><input id="f_${id}" type="password" placeholder="${p}" autocomplete="new-password"><button type="button" onclick="const i=$('#f_${id}');i.type=i.type==='password'?'text':'password'" aria-label="Show or hide password">${ic('eye')}</button></div>`;
const upl=(id,t,sub)=>`<label class="upl"><div class="pl" id="pv_${id}">+</div><div><b>${t}</b><span id="ps_${id}">${sub}</span></div><input type="file" accept="image/*" onchange="aPick('${id}',this)"></label>`;
function aPick(id,el){
 const f=el.files&&el.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=()=>{const im=new Image();im.onload=()=>{
  const M=720,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  AF[id]=c.toDataURL('image/jpeg',.72);
  $('#pv_'+id).innerHTML='<img src="'+AF[id]+'" alt="">';$('#ps_'+id).textContent='Selected · tap to change';
 };im.onerror=()=>aerr('This image could not be read.');im.src=rd.result};
 rd.readAsDataURL(f);
}
function aGeo(){
 const d=$('#f_rd').value,u=$('#f_ru');
 u.innerHTML='<option value="">Select upazila / থানা</option>'+(GEO[d]||[]).map(x=>`<option>${esc(x)}</option>`).join('');
}
function aAddM(){
 aSheet(`<div class="sheetf"><h3 class="fh">Create merchant account</h3>${fld('mn','Merchant name',{p:'Your full name'})}${fld('ms','Shop name',{p:'Your shop or page name'})}${fld('mp','Mobile number',{p:'01XXXXXXXXX',m:'numeric',t:'tel'})}${pwf('mw','At least 6 characters')}<div id="aerr" class="err"></div><div class="two" style="margin-top:12px"><button class="btn line" onclick="aClose()">Cancel</button><button class="btn pri" onclick="aSaveM()">Create account</button></div></div>`);
}
async function aSaveM(){
 const name=v('mn'),shop=v('ms'),phone=v('mp'),pw=$('#f_mw').value;
 if(!name)return aerr('Enter the merchant name.');
 if(!shop)return aerr('Enter the shop name.');
 if(!okPhone(phone))return aerr('Enter a valid 11-digit mobile number (01XXXXXXXXX).');
 if(pw.length<6)return aerr('Password must be at least 6 characters.');
 if(D.merchants.some(m=>m.phone===phone))return aerr('A merchant with this number already exists.');
 const salt=Math.random().toString(36).slice(2),hash=await sha(salt+pw);
 net.set('merchants',phone,{id:phone,mn:name,sn:shop,ph:phone,ts:Date.now(),shop,name,phone,salt,hash,pickup:'',pay:'',fb:'',sms:true,push:true,points:0,blocked:false,joined:Date.now(),lastSeen:null,addedBy:'Admin'})
  .then(()=>{aClose();atoast('Merchant added')}).catch(e=>aerr('Could not save: '+((e&&(e.code||e.message))||'try again')));
}
function aAddR(){
 delete AF.rp;delete AF.rd;delete AF.rl;
 const ds=Object.keys(GEO).sort();
 aSheet(`<div class="sheetf"><h3 class="fh">Create rider account</h3>${fld('rn','Full name',{p:'Your full name'})}${fld('rp','Mobile number',{p:'01XXXXXXXXX',m:'numeric',t:'tel'})}
 <label for="f_rd">Delivery area — District</label><select id="f_rd" onchange="aGeo()"><option value="">Select district</option>${ds.map(x=>`<option>${esc(x)}</option>`).join('')}</select>
 <label for="f_ru">Upazila / থানা</label><select id="f_ru"><option value="">Select upazila / থানা</option></select>
 ${fld('rv','Union / Village / Area (optional)',{p:'Union, village or ward name'})}${pwf('rw','At least 6 characters')}
 <label style="margin-bottom:6px">Your photo</label>${upl('rp','Your photo','Clear face photo')}
 <label for="f_rt">Document type</label><select id="f_rt"><option>NID card</option><option>Birth certificate</option></select>
 <div style="height:12px"></div>${upl('rd','NID or birth certificate','Photo of the front side')}
 <label style="margin-bottom:6px">Driving license</label>${upl('rl','Driving license','Photo of the front side')}
 <div id="aerr" class="err"></div><div class="two" style="margin-top:12px"><button class="btn line" onclick="aClose()">Cancel</button><button class="btn pri" onclick="aSaveR()">Create rider account</button></div></div>`);
}
async function aSaveR(){
 const name=v('rn'),phone=v('rp'),dist=$('#f_rd').value,up=$('#f_ru').value,un=v('rv'),pw=$('#f_rw').value,dt=$('#f_rt').value;
 if(!name)return aerr('Enter the full name.');
 if(!okPhone(phone))return aerr('Enter a valid 11-digit mobile number (01XXXXXXXXX).');
 if(!dist)return aerr('Select the district.');
 if(!up)return aerr('Select the upazila / থানা.');
 if(pw.length<6)return aerr('Password must be at least 6 characters.');
 if(!AF.rp)return aerr('Upload the rider photo.');
 if(!AF.rd)return aerr('Upload the NID or birth certificate photo.');
 if(!AF.rl)return aerr('Upload the driving license photo.');
 if(D.riders.some(r=>r.phone===phone))return aerr('A rider with this number already exists.');
 const zone=[un,up,dist].filter(Boolean).join(', '),salt=Math.random().toString(36).slice(2),hash=await sha(salt+pw),now=Date.now();
 try{
  await net.set('rider_applications',phone,{id:phone,name,phone,zone,district:dist,upazila:up,union:un,docType:dt,photo:AF.rp,doc:AF.rd,license:AF.rl,status:'verified',submittedAt:now,addedBy:'Admin'});
  await net.set('riders',phone,{name,phone,zone,district:dist,upazila:up,union:un,salt,hash,kyc:'verified',online:false,blocked:false,joined:now,addedBy:'Admin'});
  delete AF.rp;delete AF.rd;delete AF.rl;aClose();atoast('Rider added');
 }catch(e){aerr('Could not save: '+((e&&(e.code||e.message))||'photos may be too large'))}
}

/* drawer */
function aDrawer(o){$('#adbg').classList.toggle('show',!!o);$('#adw').classList.toggle('show',!!o)}
function aGo(k){A.tab=k;A.view=null;A.q='';A.pf='all';aDrawer(false);aDraw();$('#amain').scrollTop=0}
addEventListener('keydown',e=>{if(e.key==='Escape')aDrawer(false)});
(()=>{const fe=e=>e.target&&e.target.closest&&e.target.closest('input,textarea,select');
['copy','cut','dragstart','selectstart','contextmenu'].forEach(t=>document.addEventListener&&document.addEventListener(t,e=>{if(!fe(e))e.preventDefault()}))})();

/* shell */
function aDraw(){
 const root=$('#aapp');if(root.style.display!=='flex')return;
 const m=$('#amain'),st=m.scrollTop,n=aCount();
 const rqn=D.wd.filter(w=>w.status==='pending').length+D.requests.filter(r=>r.status==='open').length+D.parcels.filter(p=>p.stage==='picked_up'&&p.s==='pend').length,apn=D.apps.filter(a=>a.status==='pending').length;
 $('#ahd').innerHTML=A.logged?`<button class="hmb" onclick="aDrawer(true)" aria-label="Open menu">${ic('menu')}</button>`:'';
 $('#ahd').innerHTML+=`<div class="brand">${BRAND}<span class="rtag">ADMIN</span></div><div style="flex:1"></div>${A.logged?`<button class="abell" onclick="A.view=null;A.tab='req';aDraw()" aria-label="Needs action">${ic('bell')}${n?`<i>${n}</i>`:''}</button>`:''}`;
 $('#atabs')&&($('#atabs').style.display='none');
 const items=[['over','Overview','home',0],['req','Requests','bell',rqn],['parcels','Parcels','box',0],['merch','Merchants','shop',0],['riders','Riders','truck',apn],['msg','Messages','mail',aChatUnread()],['pop','Popups','chat',0]];
 $('#adw').innerHTML=A.logged?`<div class="dh"><div class="top"><div class="brand">${BRAND}</div><button class="dx" onclick="aDrawer(false)" aria-label="Close menu">${ic('x')}</button></div><div class="dme"><span class="rtag">ADMIN</span>Control panel</div></div><div class="dnav" role="navigation" aria-label="Admin menu"><div class="dsec">MENU</div>${items.map(([k,l,i,c])=>`<button class="di ${A.tab===k&&!A.view?'on':''}" onclick="aGo('${k}')"><span class="dic">${ic(i)}</span><span class="l">${l}</span>${c?`<i class="bdg2">${c}</i>`:''}</button>`).join('')}</div><div class="df"><button class="di" onclick="aOut()"><span class="dic">${ic('out')}</span><span class="l">Sign out</span></button></div>`:'';
 const view=()=>A.view.t==='p'?aParcelV(A.view.id):A.view.t==='m'?aMerchantV(A.view.id):aRiderV(A.view.id);
 try{m.innerHTML=!A.logged?aAuth():A.view?view():({over:aOver,req:aReq,parcels:aParcels,merch:aMerch,riders:aRiders,pop:aPopups,msg:aMsgs})[A.tab]()}catch(e){console.error(e);m.innerHTML=(A.view?aBack():'')+'<div class="card"><b>Could not display this page</b><p class="mut">'+esc(e.message)+'</p></div>'}
 m.scrollTop=st;aChatRefresh();
}
$('#aapp').style.display='flex';
aDraw();startNet();
</script>
